name: Python validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python source
        run: python -m compileall -q .
      - name: Run guarded offline release checks
        run: python -B offline_checks.py
      - name: Install pinned synthetic Ledger timezone data
        run: python -m pip install -r requirements-ledger.txt
      - name: Run isolated synthetic Ledger acceptance checks
        run: python -B -m unittest discover -v -s tests/ledger -p "test_*.py"
